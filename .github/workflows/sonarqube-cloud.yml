name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-nasa-bp-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_WRAPPER_OUT_DIR: build-wrapper-output
  REPORTS_DIR: reports
  CFS_APP_PATH: "${{ github.workspace }}/src:${{ github.workspace }}/src/bpnode/psp_mod"

jobs:
  sonarcloud:
    name: Static analysis, unit tests and coverage
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout BP source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: src/bpnode

      - name: Checkout BPLib source
        uses: actions/checkout@v4
        with:
          repository: nasa/bplib
          ref: main
          path: src/bplib

      - name: Checkout CF source
        uses: actions/checkout@v4
        with:
          repository: nasa/cf
          ref: main
          path: src/cf

      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            make \
            gcc \
            g++ \
            lcov \
            pkg-config \
            python3 \
            python3-pip

          python3 -m pip install --user gcovr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo "Tool versions:"
          gcc --version
          cmake --version
          python3 --version
          gcovr --version

      - name: Install SonarQube Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v8

      - name: Set up cFS bundle
        uses: ./src/bpnode/.github/actions/setup-cfs
        with:
          bundle-dir: ${{ github.workspace }}/cfs-bundle
          upstream-repo: nasa/cFS
          upstream-ref: main

      - name: Set up QCBOR
        uses: ./src/bplib/.github/actions/setup-qcbor
        with:
          staging-dir: ${{ github.workspace }}/qcbor-source
          upstream-repo: laurencelundblade/QCBOR
          upstream-ref: v1.5.1

      - name: Checkout TinyCBOR source
        uses: actions/checkout@v4
        with:
          repository: intel/tinycbor
          ref: v0.6.0
          path: tinycbor-source

      - name: Build and install TinyCBOR
        run: |
          set -e

          echo "TinyCBOR source contents:"
          ls -lah tinycbor-source

          make -C tinycbor-source -j2 \
            BUILD_SHARED=1 \
            BUILD_STATIC=1

          sudo make -C tinycbor-source install \
            prefix=/usr/local \
            BUILD_SHARED=1 \
            BUILD_STATIC=1

          sudo ldconfig

          echo "Checking TinyCBOR installation:"
          ls -lah /usr/local/include/tinycbor || true
          ls -lah /usr/local/lib/libtinycbor* || true
          pkg-config --modversion tinycbor || true

      - name: Prepare cFS mission configuration
        run: |
          set -e

          mkdir -p bpxfer_defs

          echo "Available cFE sample_defs files:"
          ls -lah ./cfs-bundle/cfe/cmake/sample_defs

          echo "Available BP buildconfig files:"
          find ./src/bpnode/.github/buildconfig -maxdepth 2 \( -type f -o -type d \) | sort

          if [ -f ./cfs-bundle/cfe/cmake/sample_defs/cfe_perfids.h ]; then
            cp -v ./cfs-bundle/cfe/cmake/sample_defs/cfe_perfids.h \
              ./bpxfer_defs/cfe_perfids.h
          elif [ -f ./cfs-bundle/cfe/cmake/sample_defs/sample_perfids.h ]; then
            cp -v ./cfs-bundle/cfe/cmake/sample_defs/sample_perfids.h \
              ./bpxfer_defs/cfe_perfids.h
          else
            echo "::error::No perfids header found in cFE sample_defs."
            exit 1
          fi

          cp -v -t ./bpxfer_defs \
            ./cfs-bundle/cfe/cmake/sample_defs/*osconfig*.cmake \
            ./cfs-bundle/cfe/cmake/sample_defs/*custom*.cmake \
            ./cfs-bundle/cfe/cmake/sample_defs/*options*.cmake

          cp -v -t ./bpxfer_defs \
            ./src/bpnode/.github/buildconfig/*.{cmake,scr}

          for dir in tx rx tables; do
            if [ -d "./src/bpnode/.github/buildconfig/${dir}" ]; then
              cp -rv "./src/bpnode/.github/buildconfig/${dir}" "./bpxfer_defs/${dir}"
            else
              echo "::notice::Optional buildconfig directory '${dir}' not found; skipping."
            fi
          done

          echo "Patching bpxfer_defs/targets.cmake for current cFE target names..."

          cat >> ./bpxfer_defs/targets.cmake <<'EOF'

          # ------------------------------------------------------------------
          # CI compatibility patch:
          # targets.cmake declares MISSION_CPUNAMES as "tx rx", so modern cFE
          # expects tx_PROCESSORID and rx_PROCESSORID, not cpu1_PROCESSORID.
          # ------------------------------------------------------------------

          set(tx_PROCESSORID 1)
          set(tx_PSP_MODULELIST ${GLOBAL_PSP_MODULELIST})
          set(tx_PLATFORM default)

          set(rx_PROCESSORID 2)
          set(rx_PSP_MODULELIST ${GLOBAL_PSP_MODULELIST})
          set(rx_PLATFORM default)
          EOF

          echo "Final targets.cmake:"
          cat ./bpxfer_defs/targets.cmake

          echo "Generated bpxfer_defs:"
          find ./bpxfer_defs -maxdepth 4 -type f | sort

      - name: Verify BP PSP module path
        run: |
          set -e

          echo "CFS_APP_PATH=$CFS_APP_PATH"

          echo "Checking BPNode PSP module:"
          test -f "$GITHUB_WORKSPACE/src/bpnode/psp_mod/udpsock_intf/CMakeLists.txt"

          echo "Found udpsock_intf:"
          find "$GITHUB_WORKSPACE/src/bpnode/psp_mod/udpsock_intf" -maxdepth 1 -type f -print

      - name: Prepare BP unit-test relative PSP path
        run: |
          set -e

          echo "Creating compatibility symlink expected by BP unit-test/CMakeLists.txt"
          echo "BP unit tests expect: $GITHUB_WORKSPACE/psp"
          echo "Actual cFS PSP path:  $GITHUB_WORKSPACE/cfs-bundle/psp"

          rm -rf "$GITHUB_WORKSPACE/psp"
          ln -s "$GITHUB_WORKSPACE/cfs-bundle/psp" "$GITHUB_WORKSPACE/psp"

          echo "Checking required iodriver unit-test stub:"
          test -f "$GITHUB_WORKSPACE/psp/fsw/modules/iodriver/ut-stubs/iodriver_base_stubs.c"

          ls -lah "$GITHUB_WORKSPACE/psp"
          ls -lah "$GITHUB_WORKSPACE/psp/fsw/modules/iodriver/ut-stubs/iodriver_base_stubs.c"

      - name: Clean previous build and analysis outputs
        run: |
          set -e

          rm -rf build
          rm -rf "$BUILD_WRAPPER_OUT_DIR"
          rm -rf "$REPORTS_DIR"
          rm -rf "$GITHUB_WORKSPACE/.sonar-cfamily"

      - name: Configure cFS/BP with unit tests and coverage flags
        run: |
          set -e

          cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSIMULATION=native \
            -DENABLE_UNIT_TESTS=true \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="--coverage -O0 -g -fprofile-abs-path -Wno-error=maybe-uninitialized" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage" \
            -DCMAKE_MODULE_LINKER_FLAGS="--coverage" \
            -DCMAKE_INSTALL_PREFIX=/exe \
            -DMISSIONCONFIG=bpxfer \
            -DMISSION_DEFS="$PWD/bpxfer_defs" \
            -B build \
            -S cfs-bundle/cfe

      - name: Build BPNode unit-test runners with SonarQube Build Wrapper
        id: build
        run: |
          set -euo pipefail

          mkdir -p "$REPORTS_DIR"
          rm -rf "$BUILD_WRAPPER_OUT_DIR"

          BP_TEST_TARGETS=(
            coverage-bpnode-bpnode_app-testrunner
            coverage-bpnode-bpnode_task-testrunner
            coverage-bpnode-bpnode_adu_out-testrunner
            coverage-bpnode-bpnode_adu_in-testrunner
            coverage-bpnode-bpnode_cla_in-testrunner
            coverage-bpnode-bpnode_cla_out-testrunner
            coverage-bpnode-bpnode_gen_worker-testrunner
            coverage-bpnode-bpnode_notif-testrunner
            coverage-bpnode-bpnode_maint-testrunner
            coverage-bpnode-fwp_timep-testrunner
            coverage-bpnode-fwp_tablep-testrunner
            coverage-bpnode-fwp_evp-testrunner
            coverage-bpnode-fwp_adup-testrunner
            coverage-bpnode-fwp_perflogp-testrunner
            coverage-bpnode-fwp_dp-testrunner
            coverage-bpnode-fwp_tlmp-testrunner
            coverage-bpnode-fwp_utils-testrunner
            coverage-bpnode-fwp_clap-testrunner
          )

          echo "Building only BPNode coverage test runners."

          build-wrapper-linux-x86-64 \
            --out-dir "$BUILD_WRAPPER_OUT_DIR" \
            cmake --build build/native/default \
              --target "${BP_TEST_TARGETS[@]}" \
              -- -j2 | tee "$REPORTS_DIR/build.log"

          echo "Build finished successfully."

          echo "Checking BPNode testrunner executables:"
          for target in "${BP_TEST_TARGETS[@]}"; do
            exe="$GITHUB_WORKSPACE/build/native/default/apps/bpnode/unit-test/$target"

            if [ ! -x "$exe" ]; then
              echo "::error::Expected BPNode test runner was not built or is not executable: $exe"
              echo "Searching for similar files:"
              find "$GITHUB_WORKSPACE/build/native/default/apps/bpnode" -iname "*${target}*" -print || true
              exit 1
            fi

            ls -lh "$exe"
          done

          echo "Compilation databases found:"
          find "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/$BUILD_WRAPPER_OUT_DIR" \
            -type f \
            -name compile_commands.json \
            -print \
            -exec wc -c {} \; || true

          echo "Build Wrapper output:"
          ls -lah "$BUILD_WRAPPER_OUT_DIR" || true

      - name: Run BPNode unit tests with CTest
        id: ctest
        run: |
          set -euo pipefail

          mkdir -p "$REPORTS_DIR"

          BP_CTEST_DIR="$GITHUB_WORKSPACE/build/native/default/apps/bpnode/unit-test"

          if [ ! -d "$BP_CTEST_DIR" ]; then
            echo "::error::BPNode CTest directory not found: $BP_CTEST_DIR"
            exit 1
          fi

          echo "Using BPNode CTest directory:"
          echo "$BP_CTEST_DIR"

          echo ""
          echo "Listing BPNode tests:"
          ctest --test-dir "$BP_CTEST_DIR" -N | tee "$REPORTS_DIR/ctest-bpnode-list.txt"

          echo ""
          echo "Running BPNode tests..."

          set +e

          ctest \
            --test-dir "$BP_CTEST_DIR" \
            --output-on-failure \
            --output-junit "$REPORTS_DIR/ctest-junit-bpnode.xml" \
            -j2 \
            2>&1 | tee "$REPORTS_DIR/ctest-output-bpnode.txt"

          CTEST_EXIT="${PIPESTATUS[0]}"

          set -e

          echo "$CTEST_EXIT" > "$REPORTS_DIR/ctest-exit-code.txt"
          echo "BPNode CTest exit code: $CTEST_EXIT"

          if [ "$CTEST_EXIT" != "0" ]; then
            echo ""
            echo "CTest failed. Capturing LastTest.log..."
            find "$BP_CTEST_DIR" -path '*/Testing/Temporary/LastTest.log' -print -exec cat {} \; \
              | tee "$REPORTS_DIR/ctest-lasttest-bpnode.log" || true

            echo "::error::One or more BPNode unit tests failed. Check ctest-output-bpnode.txt and ctest-lasttest-bpnode.log."
            exit "$CTEST_EXIT"
          fi

      - name: Generate SonarQube generic test execution report
        run: |
          set -e

          mkdir -p "$REPORTS_DIR"

          python3 - <<'PY'
          import glob
          import os
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports_dir = Path("reports")
          output_path = reports_dir / "test-execution.xml"

          root = ET.Element("testExecutions", version="1")
          files = {}

          test_files = sorted(Path("src/bpnode/unit-test").glob("*_tests.c"))

          known_bpnode_tests = [
              "coverage-bpnode-bpnode_app",
              "coverage-bpnode-bpnode_task",
              "coverage-bpnode-bpnode_adu_out",
              "coverage-bpnode-bpnode_adu_in",
              "coverage-bpnode-bpnode_cla_in",
              "coverage-bpnode-bpnode_cla_out",
              "coverage-bpnode-bpnode_gen_worker",
              "coverage-bpnode-bpnode_notif",
              "coverage-bpnode-bpnode_maint",
              "coverage-bpnode-fwp_timep",
              "coverage-bpnode-fwp_tablep",
              "coverage-bpnode-fwp_evp",
              "coverage-bpnode-fwp_adup",
              "coverage-bpnode-fwp_perflogp",
              "coverage-bpnode-fwp_dp",
              "coverage-bpnode-fwp_tlmp",
              "coverage-bpnode-fwp_utils",
              "coverage-bpnode-fwp_clap",
          ]

          def strip_ansi(text: str) -> str:
              return re.sub(r"\x1b\[[0-9;]*m", "", text)

          def guess_test_file(test_name: str) -> str:
              if not test_files:
                  print("::error::No *_tests.c files found under src/bpnode/unit-test.")
                  sys.exit(1)

              normalized = test_name.lower()
              normalized = normalized.replace("coverage-bpnode-", "")
              normalized = normalized.replace("coverage_bpnode_", "")
              normalized = normalized.replace("-testrunner", "")
              normalized = normalized.replace("_testrunner", "")
              normalized = normalized.replace("-", "_")
              normalized = normalized.replace(".", "_")

              for candidate in test_files:
                  stem = candidate.stem.lower()          # example: bpnode_app_tests
                  short = stem.replace("_tests", "")     # example: bpnode_app

                  if short in normalized or normalized in short or stem in normalized:
                      return candidate.as_posix()

              # Fallback: Sonar generic test execution requires a real test file.
              return test_files[0].as_posix()

          def file_node(path: str):
              if path not in files:
                  files[path] = ET.SubElement(root, "file", path=path)
              return files[path]

          def add_case(name: str, duration_ms: int = 0, status: str = "passed", message: str = ""):
              fnode = file_node(guess_test_file(name))
              case = ET.SubElement(
                  fnode,
                  "testCase",
                  name=name,
                  duration=str(max(0, int(duration_ms))),
              )

              if status == "failed":
                  fail = ET.SubElement(case, "failure", message=message or "failure")
                  fail.text = message or ""
              elif status == "error":
                  err = ET.SubElement(case, "error", message=message or "error")
                  err.text = message or ""
              elif status == "skipped":
                  ET.SubElement(case, "skipped", message=message or "skipped")

          def child_by_localname(node, localname):
              for child in list(node):
                  if child.tag.split("}")[-1] == localname:
                      return child
              return None

          total_cases = 0
          seen = set()

          # 1) Try CTest JUnit first.
          junit_paths = sorted(glob.glob("reports/ctest-junit-bpnode*.xml"))

          for junit_path in junit_paths:
              if not os.path.exists(junit_path) or os.path.getsize(junit_path) == 0:
                  continue

              print(f"Reading JUnit report: {junit_path}")

              try:
                  tree = ET.parse(junit_path)
              except ET.ParseError as exc:
                  print(f"::warning::Could not parse {junit_path}: {exc}")
                  continue

              for tc in tree.iter():
                  if tc.tag.split("}")[-1] != "testcase":
                      continue

                  name = tc.get("name") or tc.get("classname") or "ctest"
                  classname = tc.get("classname") or ""
                  full_name = f"{classname}.{name}" if classname else name

                  if full_name in seen:
                      continue

                  seen.add(full_name)

                  try:
                      duration_ms = int(float(tc.get("time", "0") or "0") * 1000)
                  except ValueError:
                      duration_ms = 0

                  status = "passed"
                  message = ""

                  failure = child_by_localname(tc, "failure")
                  error = child_by_localname(tc, "error")
                  skipped = child_by_localname(tc, "skipped")

                  if failure is not None:
                      status = "failed"
                      message = failure.get("message", "") or failure.text or ""
                  elif error is not None:
                      status = "error"
                      message = error.get("message", "") or error.text or ""
                  elif skipped is not None:
                      status = "skipped"
                      message = skipped.get("message", "") or skipped.text or ""

                  add_case(full_name, duration_ms, status, message)
                  total_cases += 1

          # 2) If JUnit is empty, parse normal CTest output.
          if total_cases == 0:
              print("::warning::No <testcase> entries found in CTest JUnit. Falling back to ctest-output-bpnode.txt.")

              for output_file in sorted(glob.glob("reports/ctest-output-bpnode*.txt")):
                  print(f"Reading CTest output: {output_file}")

                  text = strip_ansi(Path(output_file).read_text(encoding="utf-8", errors="replace"))

                  # Handles lines such as:
                  # Test #1: coverage-bpnode-bpnode_app ........ Passed 0.03 sec
                  # 1/18 Test #1: coverage-bpnode-bpnode_app .... Passed 0.03 sec
                  pattern = re.compile(
                      r"(?:\d+/\d+\s+)?Test\s+#\d+:\s+(.+?)\s+.*?"
                      r"(Passed|Failed|Timeout|Skipped|Not Run|Subprocess aborted)\s+"
                      r"([0-9.]+)\s+sec",
                      re.IGNORECASE,
                  )

                  for match in pattern.finditer(text):
                      test_name = match.group(1).strip()
                      status_raw = match.group(2).strip().lower()
                      seconds = float(match.group(3))

                      if test_name in seen:
                          continue

                      seen.add(test_name)

                      if status_raw == "passed":
                          status = "passed"
                      elif status_raw in ("skipped", "not run"):
                          status = "skipped"
                      else:
                          status = "failed"

                      add_case(test_name, int(seconds * 1000), status, status_raw)
                      total_cases += 1

          # 3) If output parsing still fails, use the CTest list.
          if total_cases == 0:
              print("::warning::No cases found in CTest output. Falling back to ctest-bpnode-list.txt.")

              list_path = reports_dir / "ctest-bpnode-list.txt"

              if list_path.exists():
                  text = strip_ansi(list_path.read_text(encoding="utf-8", errors="replace"))

                  for line in text.splitlines():
                      match = re.search(r"Test\s+#\d+:\s+(.+)$", line)
                      if not match:
                          continue

                      test_name = match.group(1).strip()

                      if not test_name or test_name in seen:
                          continue

                      seen.add(test_name)
                      add_case(test_name, 0, "passed", "")
                      total_cases += 1

          # 4) Last fallback: we reached this step only if CTest passed,
          # so these known BPNode tests can be represented as passed.
          if total_cases == 0:
              print("::warning::No CTest metadata could be parsed. Falling back to known BPNode test target list.")

              for test_name in known_bpnode_tests:
                  if test_name in seen:
                      continue

                  seen.add(test_name)
                  add_case(test_name, 0, "passed", "")
                  total_cases += 1

          ET.ElementTree(root).write(
              output_path,
              encoding="utf-8",
              xml_declaration=True,
          )

          print(f"Wrote {output_path}")
          print(f"Generic test cases exported: {total_cases}")

          if total_cases == 0:
              print("::error::No test cases were exported to Sonar generic test execution report.")
              sys.exit(1)
          PY

          test -s "$REPORTS_DIR/test-execution.xml"
          echo "Sonar generic test execution report preview:"
          head -n 120 "$REPORTS_DIR/test-execution.xml"

      - name: Generate coverage report for SonarQube Cloud
        run: |
          set -e

          mkdir -p "$REPORTS_DIR"

          echo "Looking for GCC coverage files..."
          echo ".gcno files:"
          find build -type f -name '*.gcno' -print | head -n 80 || true

          echo ".gcda files:"
          find build -type f -name '*.gcda' -print | head -n 80 || true

          GCDA_COUNT="$(find build -type f -name '*.gcda' | wc -l | tr -d ' ')"
          echo "GCDA_COUNT=$GCDA_COUNT"

          if [ "$GCDA_COUNT" -eq 0 ]; then
            echo "::error::No .gcda files were found. Unit tests did not generate runtime coverage data."
            exit 1
          fi

          gcovr \
            --root "$GITHUB_WORKSPACE" \
            --object-directory "$GITHUB_WORKSPACE/build" \
            --sonarqube-pretty \
            --sonarqube "$REPORTS_DIR/coverage-sonarqube.xml" \
            --filter "$GITHUB_WORKSPACE/src/bpnode/fsw/.*" \
            --filter "$GITHUB_WORKSPACE/src/bpnode/psp_mod/.*" \
            --exclude "$GITHUB_WORKSPACE/src/bpnode/unit-test/.*" \
            --exclude "$GITHUB_WORKSPACE/src/bpnode/docs/.*" \
            --exclude "$GITHUB_WORKSPACE/src/bpnode/cosmos/.*" \
            --exclude "$GITHUB_WORKSPACE/src/bpnode/config/.*" \
            --exclude "$GITHUB_WORKSPACE/src/bpnode/.github/.*" \
            --exclude-directories "$GITHUB_WORKSPACE/build/CMakeFiles" \
            --gcov-ignore-errors=all \
            --print-summary

          test -s "$REPORTS_DIR/coverage-sonarqube.xml"

          echo "Coverage report generated:"
          ls -lh "$REPORTS_DIR/coverage-sonarqube.xml"

          echo "Coverage report preview:"
          head -n 80 "$REPORTS_DIR/coverage-sonarqube.xml"

      - name: Validate SonarQube coverage report
        run: |
          set -e

          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          report = workspace / os.environ.get("REPORTS_DIR", "reports") / "coverage-sonarqube.xml"

          if not report.exists() or report.stat().st_size == 0:
              print("::error::Coverage report does not exist or is empty.")
              sys.exit(1)

          tree = ET.parse(report)
          root = tree.getroot()

          keep_prefixes = (
              "src/bpnode/fsw/",
              "src/bpnode/psp_mod/",
          )

          total_lines = 0
          covered_lines = 0
          files_kept = 0
          files_removed = 0

          for file_node in list(root.findall("file")):
              raw_path = file_node.get("path", "")

              path = raw_path
              p = Path(raw_path)

              if p.is_absolute():
                  try:
                      path = p.resolve(strict=False).relative_to(workspace).as_posix()
                  except ValueError:
                      path = raw_path

              path = path.replace("\\", "/")
              file_node.set("path", path)

              if not path.startswith(keep_prefixes):
                  root.remove(file_node)
                  files_removed += 1
                  continue

              files_kept += 1

              for line in file_node.findall("lineToCover"):
                  total_lines += 1
                  if line.get("covered") == "true":
                      covered_lines += 1

          tree.write(report, encoding="utf-8", xml_declaration=True)

          print(f"Coverage files kept: {files_kept}")
          print(f"Coverage files removed outside BP source scope: {files_removed}")
          print(f"Coverable lines in Sonar scope: {total_lines}")
          print(f"Covered lines in Sonar scope: {covered_lines}")

          if total_lines == 0:
              print("::error::The coverage report contains no coverable lines for src/bpnode/fsw or src/bpnode/psp_mod.")
              sys.exit(1)

          if covered_lines == 0:
              print("::error::The coverage report contains 0 covered lines for the Sonar source scope.")
              print("This would produce 0.0% coverage in SonarQube Cloud, so the workflow stops here.")
              sys.exit(1)
          PY

          echo "Validated coverage report preview:"
          head -n 80 "$REPORTS_DIR/coverage-sonarqube.xml"

      - name: Prepare SonarQube CFamily inputs
        id: sonar_inputs
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/.sonar-cfamily"

          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          project_dir = (workspace / "src" / "bpnode").resolve()
          wrapper_dir = (workspace / os.environ.get("BUILD_WRAPPER_OUT_DIR", "build-wrapper-output")).resolve()
          sonar_dir = (workspace / ".sonar-cfamily").resolve()
          sonar_dir.mkdir(parents=True, exist_ok=True)

          print(f"Workspace: {workspace}")
          print(f"BP project dir: {project_dir}")
          print(f"Build Wrapper dir: {wrapper_dir}")

          candidate_paths = []

          wrapper_compile_commands = wrapper_dir / "compile_commands.json"
          if wrapper_compile_commands.exists():
              candidate_paths.append(wrapper_compile_commands)

          build_dir = workspace / "build"
          if build_dir.exists():
              candidate_paths.extend(sorted(build_dir.rglob("compile_commands.json")))

          unique_candidates = []
          seen = set()

          for candidate in candidate_paths:
              candidate = candidate.resolve()
              if candidate not in seen:
                  unique_candidates.append(candidate)
                  seen.add(candidate)

          print("Candidate compile_commands.json files:")
          for candidate in unique_candidates:
              print(f"  - {candidate}")

          if not unique_candidates:
              print("::error::No compile_commands.json files were found.")
              sys.exit(1)

          source_prefixes = (
              "fsw/",
              "psp_mod/",
          )

          excluded_prefixes = (
              "docs/",
              "cosmos/",
              "config/",
              ".github/",
              "unit-test/",
          )

          c_extensions = (
              ".c",
              ".cc",
              ".cpp",
              ".cxx",
              ".c++",
              ".C",
          )

          def resolve_directory(entry):
              raw_directory = entry.get("directory")

              if not raw_directory:
                  return workspace

              directory = Path(raw_directory)

              if not directory.is_absolute():
                  directory = workspace / directory

              return directory.resolve(strict=False)

          def resolve_file(entry):
              raw_file = entry.get("file")

              if not raw_file:
                  return None

              file_path = Path(raw_file)

              if not file_path.is_absolute():
                  file_path = resolve_directory(entry) / file_path

              return file_path.resolve(strict=False)

          def load_entries(db_path):
              try:
                  data = json.loads(db_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"::warning::Could not read {db_path}: {exc}")
                  return [], []

              kept = []
              all_files = []

              for entry in data:
                  file_path = resolve_file(entry)

                  if file_path is None:
                      continue

                  all_files.append(str(file_path))

                  try:
                      rel = file_path.relative_to(project_dir)
                  except ValueError:
                      continue

                  rel_posix = rel.as_posix()

                  if not rel_posix.endswith(c_extensions):
                      continue

                  if not rel_posix.startswith(source_prefixes):
                      continue

                  if rel_posix.startswith(excluded_prefixes):
                      continue

                  clean_entry = dict(entry)
                  clean_entry["file"] = str(file_path)
                  clean_entry["directory"] = str(resolve_directory(entry))

                  kept.append(clean_entry)

              return kept, all_files

          best_candidate = None
          best_entries = []
          debug_files = {}

          for candidate in unique_candidates:
              entries, all_files = load_entries(candidate)
              debug_files[str(candidate)] = all_files

              print("")
              print(f"Candidate: {candidate}")
              print(f"  Total compile units: {len(all_files)}")
              print(f"  BP source compile units kept: {len(entries)}")

              for entry in entries[:25]:
                  file_path = Path(entry["file"])
                  try:
                      print(f"    + {file_path.relative_to(project_dir).as_posix()}")
                  except ValueError:
                      print(f"    + {file_path}")

              if len(entries) > len(best_entries):
                  best_candidate = candidate
                  best_entries = entries

          deduped = []
          seen_files = set()

          for entry in best_entries:
              file_name = entry["file"]

              if file_name in seen_files:
                  continue

              deduped.append(entry)
              seen_files.add(file_name)

          if not deduped:
              print("")
              print("::error::No BP source compilation units were found in any compile_commands.json.")
              print("This prevents Sonar CFamily from analyzing the BP C files.")
              print("")
              print("First files seen in each candidate DB:")

              for candidate, files in debug_files.items():
                  print(f"--- {candidate}")
                  for file_name in files[:80]:
                      print(f"    {file_name}")

              sys.exit(1)

          output_path = sonar_dir / "compile_commands.json"
          output_path.write_text(
              json.dumps(deduped, indent=2),
              encoding="utf-8",
          )

          print("")
          print(f"Selected DB: {best_candidate}")
          print(f"Wrote Sonar CFamily DB: {output_path}")
          print(f"BP source compilation units for Sonar: {len(deduped)}")
          PY

          test -s "$GITHUB_WORKSPACE/.sonar-cfamily/compile_commands.json"

          echo "Final Sonar compile_commands.json:"
          ls -lh "$GITHUB_WORKSPACE/.sonar-cfamily/compile_commands.json"
          head -n 80 "$GITHUB_WORKSPACE/.sonar-cfamily/compile_commands.json"

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasa-bp-test-and-coverage-reports
          path: |
            reports/
            build-wrapper-output/
            .sonar-cfamily/
            build/compile_commands.json
            build/**/compile_commands.json
            build/**/*.gcda
            build/**/*.gcno
          if-no-files-found: warn

      - name: SonarQube Cloud Scan
        if: ${{ steps.sonar_inputs.outputs.ready == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=Javier-Sinuka_bp
            -Dsonar.organization=javier-sinuka
            -Dsonar.projectName=nasa-bp
            -Dsonar.projectVersion=1.0
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.sources=src/bpnode/fsw,src/bpnode/psp_mod
            -Dsonar.tests=src/bpnode/unit-test
            -Dsonar.test.inclusions=src/bpnode/unit-test/**/*.c
            -Dsonar.exclusions=src/bpnode/docs/**,src/bpnode/cosmos/**,src/bpnode/config/**,src/bpnode/.github/**,**/*.md,**/*.txt,**/build-wrapper-dump.json
            -Dsonar.coverage.exclusions=src/bpnode/unit-test/**,**/stubs/**,**/utilities/**,src/bpnode/docs/**,src/bpnode/cosmos/**,src/bpnode/config/**,src/bpnode/dtn_defs/**,src/bpnode/eds/**
            -Dsonar.cfamily.compile-commands=${{ github.workspace }}/.sonar-cfamily/compile_commands.json
            -Dsonar.testExecutionReportPaths=reports/test-execution.xml
            -Dsonar.coverageReportPaths=reports/coverage-sonarqube.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}